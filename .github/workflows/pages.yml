name: Online demo on GitHub Pages

# Builds the browser-only edition of the site (python manage.py build_demo) and publishes it to
# GitHub Pages. Pages can't run the full Django + SQLite version; see README.md.
# One-time setting: Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the requirements
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python manage.py test

      - name: Read the Pages address
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the online demo
        run: |
          # A throwaway key: the build signs nothing, but the settings require one.
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          python manage.py build_demo --output _site --base-path "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
