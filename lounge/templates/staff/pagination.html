{% load lounge_tags %}{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pages">
  {% if page.has_previous %}<a class="btn btn--secondary btn--small" href="{% query_with page=page.previous_page_number %}">{% icon 'arrow-left' %}Previous</a>{% endif %}
  <span class="muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn--secondary btn--small" href="{% query_with page=page.next_page_number %}">Next{% icon 'arrow-right' %}</a>{% endif %}
</nav>
{% endif %}
